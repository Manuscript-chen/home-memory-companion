# 节点 H2 的参数。说明书第 10 节。
# 0.55 和 0.05 是初值，要用本户问句重新标定（说明书 10.3）。
# 模型换了（目录名、权重修改时间、维度任一变化）会重建全部向量。

model_dir: models/bge-small-zh-v1.5   # 相对仓库根目录。下载说明见 docs/weights.md
dim: 512
query_prefix: ""        # 问题侧前缀。BGE 检索用法可填“为这个句子生成表示以用于检索相关文章：”，标定后固定一个
top_k: 5                # 取余弦相似度最高的 5 行
min_sim: 0.55           # 低于此相似度的行丢掉
min_gap: 0.05           # 前两名分差小于此值时的含义见下方 min_gap_note

# 说明书原文：前两名分差小于 0.05，或者两行的物品 id 不同，不作答。
# 同一物品的两行分差小于 0.05 时，问句会退化成“你是说钥匙，还是钥匙”，
# 且答案不受影响，所以本项目只在两行物品 id 不同时提问；这是对原文的裁剪，写在代码注释里。
min_gap_note: 只在物品 id 不同时提问

# 时间词收成时间区间，是标量过滤，不交给嵌入模型理解。
# day 是相对今天的天数偏移；hours 是当天的时段。两类词可以叠加，如“昨天早上”。
time_words:
  早上: {day: 0, hours: ["05:00", "11:00"]}
  上午: {day: 0, hours: ["05:00", "11:00"]}
  中午: {day: 0, hours: ["11:00", "14:00"]}
  下午: {day: 0, hours: ["14:00", "18:00"]}
  傍晚: {day: 0, hours: ["17:00", "19:00"]}
  晚上: {day: 0, hours: ["18:00", "23:00"]}
  今天: {day: 0, hours: null}
  昨天: {day: -1, hours: null}
  前天: {day: -2, hours: null}

# 第二道筛选用：句中出现这些词就丢弃整句，改念模板。
forbidden_words: [附近, 旁边, 应该, 大概, 可能]
